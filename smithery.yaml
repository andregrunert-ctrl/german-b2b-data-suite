# Smithery.ai Model Context Protocol (MCP) Manifest
# https://smithery.ai/docs/build/project-config

runtime: "container"

build:
  dockerfile: "Dockerfile"
  dockerBuildPath: "."

startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - apifyToken
    properties:
      apifyToken:
        type: string
        description: "Your Apify API Token from https://console.apify.com/account/integrations"
  commandFunction: |-
    (config) => ({
      command: 'python',
      args: ['-m', 'german_b2b_mcp.server'],
      env: {
        APIFY_TOKEN: config.apifyToken
      }
    })
