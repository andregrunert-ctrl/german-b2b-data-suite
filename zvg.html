<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZVG-Portal 1-Klick Gutachten-Gateway</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.25rem; margin: 0 0 12px; color: #ffffff; }
    p { font-size: 0.95rem; color: #94a3b8; line-height: 1.5; margin: 0 0 20px; }
    .badge {
      display: inline-block;
      background: #0f172a;
      border: 1px solid #475569;
      color: #38bdf8;
      padding: 6px 14px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    button {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Weiterleitung zum offiziellen Justizportal…</h1>
    <div class="badge" id="azDisplay">Aktenzeichen wird geladen…</div>
    <p>
      Du wirst direkt zum amtlichen Verfahrenseintrag auf <strong>zvg-portal.de</strong> weitergeleitet.<br>
      Klicke dort einfach auf das <strong>PDF-Symbol</strong> oder das <strong>Aktenzeichen</strong>, um das Gutachten mit gültiger Justiz-Sitzung zu öffnen.
    </p>
    <form id="zvgForm" method="POST" action="https://www.zvg-portal.de/index.php?button=Suchen">
      <input type="hidden" name="ger_name" value="-- Alle Amtsgerichte --">
      <input type="hidden" name="land_abk" id="f_land_abk" value="bw">
      <input type="hidden" name="ger_id" value="0">
      <input type="hidden" name="order_by" value="2">
      <input type="hidden" name="az1" id="f_az1" value="">
      <input type="hidden" name="az2" id="f_az2" value="">
      <input type="hidden" name="az3" id="f_az3" value="">
      <input type="hidden" name="az4" id="f_az4" value="">
      <input type="hidden" name="art" value="">
      <input type="hidden" name="obj" value="">
      <input type="hidden" name="str" value="">
      <input type="hidden" name="hnr" value="">
      <input type="hidden" name="plz" value="">
      <input type="hidden" name="ort" value="">
      <input type="hidden" name="ortsteil" value="">
      <input type="hidden" name="vtermin" value="">
      <input type="hidden" name="btermin" value="">
      <button type="submit">Jetzt im ZVG-Portal öffnen</button>
    </form>
  </div>

  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const land = (params.get("land_abk") || params.get("state") || "bw").toLowerCase();
      const az = params.get("az") || params.get("case") || "";
      let az3 = params.get("az3") || "";
      let az4 = params.get("az4") || "";

      if ((!az3 || !az4) && az) {
        const m = az.match(/(\d{1,5})\s*\/\s*(\d{2,4})/);
        if (m) {
          az3 = m[1];
          az4 = m[2];
        }
      }

      document.getElementById("f_land_abk").value = land;
      document.getElementById("f_az3").value = az3;
      document.getElementById("f_az4").value = az4;
      document.getElementById("azDisplay").textContent =
        (az ? az : ("Az. " + az3 + "/" + az4)) + " (" + land.toUpperCase() + ")";

      if (land && (az3 || az4)) {
        setTimeout(function() {
          document.getElementById("zvgForm").submit();
        }, 80);
      }
    })();
  </script>
</body>
</html>
